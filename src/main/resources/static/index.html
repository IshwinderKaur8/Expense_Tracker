<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
    <label>Month <input type="month" id="month"></label>
  </header>

  <div id="message" role="status" hidden></div>

  <main>
    <section class="card">
      <h2>Monthly report</h2>
      <div id="summary" class="summary"></div>
      <div id="charts" class="charts">
        <div class="chart-box"><canvas id="category-chart"></canvas></div>
        <div class="chart-box"><canvas id="daily-chart"></canvas></div>
      </div>
      <p id="no-data" hidden>No spending recorded for this month.</p>
      <div class="table-wrap">
        <table id="category-table">
          <thead>
            <tr><th>Category</th><th class="num">Spent</th><th class="num">Share</th><th class="num">Budget</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 id="expense-form-title">Add expense</h2>
      <form id="expense-form" class="grid">
        <input id="expense-amount" type="number" step="0.01" min="0.01" placeholder="Amount" aria-label="Amount" required>
        <select id="expense-category" aria-label="Category" required></select>
        <input id="expense-date" type="date" aria-label="Date" required>
        <input id="expense-description" type="text" maxlength="255" placeholder="Description (optional)" aria-label="Description">
        <button type="submit" id="expense-submit">Add</button>
        <button type="button" id="expense-cancel" hidden>Cancel edit</button>
      </form>

      <h2 class="spaced">Expenses this month</h2>
      <div class="table-wrap">
        <table id="expense-table">
          <thead>
            <tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager">
        <button type="button" id="prev-page">Previous</button>
        <span id="page-info"></span>
        <button type="button" id="next-page">Next</button>
      </div>
    </section>

    <section class="card">
      <h2>Set budget</h2>
      <form id="budget-form" class="row">
        <select id="budget-category" aria-label="Budget category"></select>
        <input id="budget-amount" type="number" step="0.01" min="0.01" placeholder="Amount" aria-label="Budget amount" required>
        <button type="submit">Save budget</button>
      </form>
      <p class="hint">Applies to the month selected at the top. Saving again replaces the amount.</p>
    </section>

    <section class="card">
      <h2>Categories</h2>
      <ul id="category-list"></ul>
      <form id="category-form" class="row">
        <input id="category-name" type="text" maxlength="50" placeholder="New category" aria-label="Category name" required>
        <input id="category-color" type="color" value="#4e79a7" aria-label="Category color">
        <button type="submit">Add category</button>
      </form>
    </section>
  </main>
</body>
</html>
