spring.application.name=expense-tracker

# Database: defaults suit local development; containers and servers override via environment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USERNAME:expense_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
# Must be true once the site is served over HTTPS (set COOKIE_SECURE=true in production)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}