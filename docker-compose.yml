services:
  backup:
    image: mysql:8.0
    profiles: ["tools"]            # only runs when asked: docker compose run --rm backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        FILE=/backups/expense_tracker_$$(date +%Y%m%d_%H%M%S).sql.gz
        mysqldump -h db -u expense_app --no-tablespaces --single-transaction expense_tracker > "$$FILE.tmp"
        gzip -c "$$FILE.tmp" > "$$FILE"
        rm -f "$$FILE.tmp"
        gzip -t "$$FILE"
        echo "Backup written and verified: $$FILE"
        # keep only the 14 newest backups
        ls -1t /backups/expense_tracker_*.sql.gz | tail -n +15 | while read -r old; do rm -f "$$old"; done

  restore:
    image: mysql:8.0
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      BACKUP_FILE: ""
    volumes:
      - ./backups:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -n "$$BACKUP_FILE" ] || { echo "Set BACKUP_FILE, e.g. -e BACKUP_FILE=expense_tracker_20261124_210000.sql.gz"; exit 1; }
        [ -f "/backups/$$BACKUP_FILE" ] || { echo "No such file: $$BACKUP_FILE"; exit 1; }
        gzip -t "/backups/$$BACKUP_FILE"
        gunzip -c "/backups/$$BACKUP_FILE" | mysql -h db -u expense_app expense_tracker
        echo "Restored $$BACKUP_FILE"
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) on purpose: during first-time setup MySQL runs a temporary
      # server that only answers on its socket, and we must not report "healthy" then
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/expense_tracker?allowPublicKeyRetrieval=true
      DB_USERNAME: expense_app
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: "false"
      TZ: Asia/Kolkata
    ports:
      - "8080:8080"

volumes:
  db-data: