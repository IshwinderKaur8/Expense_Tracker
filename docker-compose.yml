services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) on purpose: during first-time setup MySQL runs a temporary
      # server that only answers on its socket, and we must not report "healthy" then
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/expense_tracker?allowPublicKeyRetrieval=true
      DB_USERNAME: expense_app
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: "false"
      TZ: Asia/Kolkata
    ports:
      - "8080:8080"

volumes:
  db-data: